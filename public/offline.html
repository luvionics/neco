<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ff6a00" />
    <title>Offline - NECOKU</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background: #fff7f0;
        color: #1f2937;
        text-align: center;
      }
      .card { max-width: 360px; }
      img { width: 96px; height: 96px; margin-bottom: 16px; }
      h1 { font-size: 1.4rem; margin: 0 0 8px; }
      p { margin: 0 0 20px; line-height: 1.5; color: #4b5563; }
      button {
        background: linear-gradient(135deg, #ff6a00, #ffa51f);
        color: #fff;
        border: 0;
        border-radius: 12px;
        padding: 12px 24px;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <img src="/icons/icon-192.png" alt="NECOKU" />
      <h1>Anda sedang offline</h1>
      <p>
        Koneksi internet terputus. Halaman yang pernah dibuka tetap bisa
        diakses, sedangkan data terbaru akan dimuat setelah Anda kembali online.
      </p>
      <button onclick="location.reload()">Coba lagi</button>
    </main>
    <script>
      window.addEventListener("online", function () {
        location.reload();
      });
    </script>
  </body>
</html>
